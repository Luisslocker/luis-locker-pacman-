<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Luis’s Locker — Drip Maze Run</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="topbar">
    <div class="brand">
      <span class="logo">LL</span>
      <span class="title">DRIP MAZE RUN</span>
    </div>

    <div class="hud">
      <div class="hudItem">Score: <span id="score">0</span></div>
      <div class="hudItem">Lives: <span id="lives">3</span></div>
      <div class="hudItem">Level: <span id="level">1</span></div>
    </div>
  </div>

  <div class="wrap">
    <canvas id="game" width="560" height="640"></canvas>

    <div class="panel">
      <div class="panelTitle">How to Play</div>
      <ul>
        <li>Collect all <b>Drip Drops</b> to win.</li>
        <li>Grab the <b>LL Power-Up</b> to scare enemies and collect them.</li>
        <li>Avoid enemies when they’re not scared.</li>
      </ul>

      <div class="btnRow">
        <button id="startBtn">Start / Restart</button>
        <button id="muteBtn">Sound: ON</button>
      </div>

      <div class="tiny">
        Tip: Embed this game on Shopify with an iframe.
      </div>
    </div>
  </div>

  <!-- Mobile D-pad -->
  <div class="dpad" aria-label="mobile controls">
    <button class="dp up" data-dir="up">▲</button>
    <div class="mid">
      <button class="dp left" data-dir="left">◀</button>
      <button class="dp down" data-dir="down">▼</button>
      <button class="dp right" data-dir="right">▶</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
